    <script>
      (function () {
        var path = window.location.pathname;
        var mobileIndex = path.indexOf('/mobile');
        var isMobile = mobileIndex >= 0 && (path.length === mobileIndex + 7 || path.charAt(mobileIndex + 7) === '/');
        var panelIndex = path.indexOf('/panel');
        var isPanel = panelIndex >= 0 && (path.length === panelIndex + 6 || path.charAt(panelIndex + 6) === '/');
        var isPublicRoot = path === '/' || path === '/index.html';
        var base = isMobile ? path.slice(0, mobileIndex + 1) : '';
        var panelBase = isPanel ? path.slice(0, panelIndex) + '/panel/' : '';
        var manifest = document.createElement('link');
        manifest.rel = 'manifest';
        manifest.href = isMobile
          ? base + 'mobile/manifest.webmanifest'
          : isPanel
            ? panelBase + 'manifest.webmanifest'
            : 'manifest.webmanifest';
        document.head.appendChild(manifest);
        var mobileIconHref = isMobile
          ? base + 'mobile/favicon.svg'
          : isPanel
            ? panelBase + 'favicon.svg'
            : isPublicRoot
              ? '/flower-shop.svg'
              : 'favicon.svg';
        var mobileTouchIconHref = isMobile
          ? base + 'mobile/apple-touch-icon.png'
          : isPanel
            ? panelBase + 'apple-touch-icon.png'
            : isPublicRoot
              ? '/flower-shop-icon.png'
              : 'apple-touch-icon.png';
        document.querySelectorAll('link[rel="icon"]').forEach(function (link) {
          link.href = mobileIconHref;
        });
        document.querySelectorAll('link[rel="apple-touch-icon"]').forEach(function (link) {
          link.href = mobileTouchIconHref;
        });
        if (isMobile && 'serviceWorker' in navigator) {
          try {
            var migrationKey = 'pulse-mobile-sw-migration-v2';
            if (!sessionStorage.getItem(migrationKey)) {
              var mobileScope = base + 'mobile/';
              navigator.serviceWorker.getRegistrations().then(function (registrations) {
                var stale = registrations.filter(function (registration) {
                  return new URL(registration.scope).pathname !== mobileScope;
                });
                if (!stale.length) return;
                sessionStorage.setItem(migrationKey, '1');
                return Promise.all(stale.map(function (registration) { return registration.unregister(); }))
                  .then(function () { window.location.reload(); });
              }).catch(function () {});
            }
          } catch (error) {}
        }
      })();
    </script>
