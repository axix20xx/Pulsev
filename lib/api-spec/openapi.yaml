openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Telegram authentication and sessions
  - name: dashboard
    description: Workspace summaries
  - name: sales
    description: Sales ledger operations
  - name: services
    description: Subscription service operations
  - name: customers
    description: Customer operations
  - name: search
    description: Cross-workspace search
  - name: resellers
    description: Master-admin reseller operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/session:
    get:
      operationId: getAuthSession
      tags: [auth]
      summary: Get the current authenticated session
      responses:
        "200":
          description: Current session or signed-out state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /auth/telegram:
    post:
      operationId: loginWithTelegram
      tags: [auth]
      summary: Sign in with a Telegram Login Widget payload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramLoginInput"
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Invalid Telegram login
        "503":
          description: Telegram authentication is not configured
  /auth/telegram-id:
    post:
      operationId: loginWithTelegramId
      tags: [auth]
      summary: Temporary sign in with an allowlisted Telegram numeric ID
      description: Transitional login for internal use before the Telegram widget is enabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramIdLoginInput"
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "403":
          description: Telegram ID is not allowlisted
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      responses:
        "204":
          description: Session ended
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get role-aware dashboard data
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /sales:
    get:
      operationId: listSales
      tags: [sales]
      summary: List sales visible to the current user
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/FromDate"
        - $ref: "#/components/parameters/ToDate"
      responses:
        "200":
          description: Visible sales
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sale"
  /admin/sales:
    get:
      operationId: listAdminSales
      tags: [sales]
      summary: List all customer sales for the master admin
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/FromDate"
        - $ref: "#/components/parameters/ToDate"
        - $ref: "#/components/parameters/ResellerId"
      responses:
        "200":
          description: Customer sales grouped by reseller context
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminSale"
        "403":
          description: Master admin access required
  /admin/sales/{id}:
    delete:
      operationId: deleteAdminSale
      tags: [sales]
      summary: Delete one customer sales-log row
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Sales-log row deleted
        "403":
          description: Master admin access required
        "404":
          description: Sales-log row not found
  /search:
    get:
      operationId: searchWorkspace
      tags: [search]
      summary: Search visible customers, services, sales, and subscription links
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Matching records visible to the current user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceSearchResult"
  /sales-summary:
    get:
      operationId: getSalesSummary
      tags: [sales]
      summary: Get date-filtered sales and reseller financial summary
      parameters:
        - $ref: "#/components/parameters/FromDate"
        - $ref: "#/components/parameters/ToDate"
      responses:
        "200":
          description: Sales summary for the requested date range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesSummary"
  /reseller-credit-sales/{id}:
    patch:
      operationId: updateResellerCreditSale
      tags: [sales]
      summary: Update a reseller credit payment
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResellerCreditSaleUpdate"
      responses:
        "200":
          description: Updated reseller credit sale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResellerCreditSale"
  /reseller-settlement-payments:
    post:
      operationId: createResellerSettlementPayment
      tags: [sales]
      summary: Record a reseller settlement payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResellerSettlementPaymentCreate"
      responses:
        "201":
          description: Recorded reseller settlement payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResellerSettlementPayment"
  /sales/{id}:
    patch:
      operationId: updateSale
      tags: [sales]
      summary: Update payment and price fields on a sale
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleUpdate"
      responses:
        "200":
          description: Updated sale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"
  /services:
    get:
      operationId: listServices
      tags: [services]
      summary: List services visible to the current user
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/ServicesLimit"
      responses:
        "200":
          description: Visible services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
    post:
      operationId: createService
      tags: [services]
      summary: Provision a service on Rain and save it to PostgreSQL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceInput"
      responses:
        "201":
          description: Provisioned service and sale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateServiceResult"
        "400":
          description: Invalid service input
        "502":
          description: Rain panel rejected the service
  /services/{id}:
    patch:
      operationId: updateService
      tags: [services]
      summary: Update service state and note
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceUpdate"
      responses:
        "200":
          description: Updated service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
  /services/{id}/renew:
    post:
      operationId: renewService
      tags: [services]
      summary: Renew a visible service
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenewServiceInput"
      responses:
        "200":
          description: Renewed service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
  /services/{id}/reset-token:
    post:
      operationId: resetServiceToken
      tags: [services]
      summary: Revoke and replace a subscription token
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: New subscription link
          content:
            application/json:
              schema:
                type: object
                required: [subscription_url]
                properties:
                  subscription_url:
                    type: string
  /services/{id}/awg:
    post:
      operationId: createServiceAwg
      tags: [services]
      summary: Create an AmneziaWG client for a visible service
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "201":
          description: AmneziaWG client created
  /services/{id}/repair-provider:
    post:
      operationId: repairServiceProvider
      tags: [services]
      summary: Reactivate one Xray provider user without resetting usage
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceProviderRepairInput"
      responses:
        "200":
          description: One provider user was repaired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceProviderRepairResult"
        "400":
          description: Invalid repair request
        "404":
          description: Service or provider user not found
        "409":
          description: Service is expired, disabled, out of quota, or busy
        "502":
          description: Provider rejected the repair
  /services/{id}/awg/config:
    get:
      operationId: downloadServiceAwg
      tags: [services]
      summary: Download an AmneziaWG configuration
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: WireGuard configuration file
          content:
            text/plain:
              schema:
                type: string
  /customers:
    get:
      operationId: listCustomers
      tags: [customers]
      summary: List customers visible to the current user
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Visible customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Customer"
  /customers/{id}:
    get:
      operationId: getCustomer
      tags: [customers]
      summary: Get a customer and their visible history
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Customer details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerDetail"
  /resellers:
    get:
      operationId: listResellers
      tags: [resellers]
      summary: List resellers for the master admin
      responses:
        "200":
          description: Resellers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reseller"
  /resellers/{id}:
    patch:
      operationId: updateReseller
      tags: [resellers]
      summary: Enable or disable a reseller
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResellerUpdate"
      responses:
        "200":
          description: Updated reseller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reseller"
  /public/subscription/{token}/openvpn:
    post:
      operationId: createOpenVpnAccount
      tags: [services]
      summary: Create or retrieve OpenVPN access for a subscription
      parameters:
        - $ref: "#/components/parameters/SubscriptionToken"
      responses:
        "200":
          description: OpenVPN account details and import locations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenVpnDelivery"
        "404":
          description: Subscription not found
        "410":
          description: Subscription is no longer active
        "503":
          description: No OpenVPN provider is configured
  /public/subscription/{token}/openvpn/config/{provider}/{host}:
    get:
      operationId: downloadOpenVpnProfile
      tags: [services]
      summary: Download a private OpenVPN profile for a subscription
      parameters:
        - $ref: "#/components/parameters/SubscriptionToken"
        - $ref: "#/components/parameters/OpenVpnProviderPath"
        - $ref: "#/components/parameters/OpenVpnHostPath"
      responses:
        "200":
          description: OpenVPN profile file
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Subscription or provider not found
        "410":
          description: Subscription is no longer active
  /public/subscription/{token}/openvpn/bundle/{provider}:
    get:
      operationId: downloadOpenVpnBundle
      tags: [services]
      summary: Download the OpenVPN profiles bundle for a subscription
      parameters:
        - $ref: "#/components/parameters/SubscriptionToken"
        - $ref: "#/components/parameters/OpenVpnProviderPath"
      responses:
        "200":
          description: OpenVPN profile bundle
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Subscription or provider not found
        "410":
          description: Subscription is no longer active
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: number
        minimum: 1
    SubscriptionToken:
      name: token
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{12,256}$"
    OpenVpnProviderPath:
      name: provider
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9_-]{2,64}$"
    OpenVpnHostPath:
      name: host
      in: path
      required: true
      schema:
        type: string
        maxLength: 80
        pattern: "^[A-Za-z0-9._-]{1,80}$"
    Search:
      name: search
      in: query
      required: false
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: number
        minimum: 1
        maximum: 200
        default: 100
    ServicesLimit:
      name: limit
      in: query
      required: false
      description: Maximum visible services returned for management filtering
      schema:
        type: number
        minimum: 1
        maximum: 5000
        default: 1000
    FromDate:
      name: from
      in: query
      required: false
      description: Start date in ISO Gregorian format; the UI displays this as a Persian date.
      schema:
        type: string
        pattern: '^\d{4}-\d{2}-\d{2}$'
    ToDate:
      name: to
      in: query
      required: false
      description: End date in ISO Gregorian format; the UI displays this as a Persian date.
      schema:
        type: string
        pattern: '^\d{4}-\d{2}-\d{2}$'
    ResellerId:
      name: reseller_id
      in: query
      required: false
      schema:
        type: number
        minimum: 1
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    TelegramLoginInput:
      type: object
      required: [id, auth_date, hash]
      properties:
        id:
          type: number
          format: int64
        first_name:
          type: string
        last_name:
          type: ["string", "null"]
        username:
          type: ["string", "null"]
        photo_url:
          type: ["string", "null"]
        auth_date:
          type: number
        hash:
          type: string
    TelegramIdLoginInput:
      type: object
      required: [telegram_id]
      properties:
        telegram_id:
          type: number
          format: int64
          minimum: 1
    CreateServiceInput:
      type: object
      required: [customer_name, phone, label, gb, days]
      properties:
        customer_name:
          type: string
          minLength: 1
        phone:
          type: string
          minLength: 3
        label:
          type: string
          minLength: 1
          maxLength: 64
        gb:
          type: number
          exclusiveMinimum: 0
        days:
          type: number
          minimum: 1
        sell_price:
          type: ["number", "null"]
          minimum: 0
        is_paid:
          type: boolean
          default: true
    AuthSession:
      type: object
      required: [authenticated, role]
      properties:
        authenticated:
          type: boolean
        role:
          type: string
          enum: [signed_out, master_admin, reseller]
        telegram_id:
          type: ["number", "null"]
          format: int64
        display_name:
          type: ["string", "null"]
        reseller_id:
          type: ["number", "null"]
          format: int32
        title:
          type: ["string", "null"]
        customer_price_per_gb:
          type: ["number", "null"]
    DashboardDay:
      type: object
      required: [day, sales_count, sold_gb, income, paid_income, unpaid_income, profit, paid_profit, unpaid_profit]
      properties:
        day:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        sales_count:
          type: number
        sold_gb:
          type: number
        income:
          type: number
        paid_income:
          type: number
        unpaid_income:
          type: number
        profit:
          type: number
        paid_profit:
          type: number
        unpaid_profit:
          type: number
    DashboardSummary:
      type: object
      required: [revenue, active_services, renewals_due, service_health, visible_customers, visible_resellers, month_sales_count, month_sold_gb, month_income, month_paid_income, month_unpaid_income, month_profit, month_daily, disabled_today, generated_at, recent_activity]
      properties:
        revenue:
          type: number
        active_services:
          type: number
        renewals_due:
          type: number
        service_health:
          type: number
        visible_customers:
          type: number
        visible_resellers:
          type: number
        month_sales_count:
          type: number
        month_sold_gb:
          type: number
        month_income:
          type: number
        month_paid_income:
          type: number
        month_unpaid_income:
          type: number
        month_profit:
          type: number
        month_daily:
          type: array
          items:
            $ref: "#/components/schemas/DashboardDay"
        disabled_today:
          type: number
        generated_at:
          type: string
        recent_activity:
          type: array
          items:
            $ref: "#/components/schemas/Activity"
    SalesSummary:
      type: object
      required: [from, to, sold_gb, income, paid_income, unpaid_income, admin_cost, admin_due, admin_due_gb, outstanding_admin_due, outstanding_admin_due_gb, remaining_profit, paid_profit, unpaid_profit, remaining_to_collect, cash_after_admin, reseller_due, reseller_paid, reseller_remaining, reseller_due_gb, reseller_profit, reseller_balances, reseller_credit_sales, reseller_sales, reseller_settlements, reseller_payment_history]
      properties:
        from:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        to:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        sold_gb:
          type: number
        income:
          type: number
        paid_income:
          type: number
        unpaid_income:
          type: number
        admin_cost:
          type: number
        admin_due:
          type: number
        admin_due_gb:
          type: number
        outstanding_admin_due:
          type: number
        outstanding_admin_due_gb:
          type: number
        remaining_profit:
          type: number
        paid_profit:
          type: number
        unpaid_profit:
          type: number
        remaining_to_collect:
          type: number
        cash_after_admin:
          type: number
        reseller_due:
          type: number
        reseller_paid:
          type: number
        reseller_remaining:
          type: number
        reseller_due_gb:
          type: number
        reseller_profit:
          type: number
        reseller_balances:
          type: array
          items:
            $ref: "#/components/schemas/ResellerBalance"
        reseller_credit_sales:
          type: array
          items:
            $ref: "#/components/schemas/ResellerCreditSale"
        reseller_sales:
          type: array
          items:
            $ref: "#/components/schemas/ResellerSalesSummary"
        reseller_settlements:
          type: array
          items:
            $ref: "#/components/schemas/ResellerSettlementBalance"
        reseller_payment_history:
          type: array
          items:
            $ref: "#/components/schemas/ResellerSettlementPayment"
    ResellerBalance:
      type: object
      required: [reseller_tg_id, reseller_name, due_gb, due_amount, paid_amount, remaining_amount, profit_amount]
      properties:
        reseller_tg_id:
          type: number
          format: int64
        reseller_name:
          type: string
        due_gb:
          type: number
        due_amount:
          type: number
        paid_amount:
          type: number
        remaining_amount:
          type: number
        profit_amount:
          type: number
    ResellerCreditSale:
      type: object
      required: [id, reseller_tg_id, reseller_name, gb_amount, unit_price, total_amount, profit_amount, paid, note, created_at]
      properties:
        id:
          type: number
        reseller_tg_id:
          type: number
          format: int64
        reseller_name:
          type: string
        gb_amount:
          type: number
        unit_price:
          type: number
        total_amount:
          type: number
        profit_amount:
          type: number
        paid:
          type: boolean
        note:
          type: ["string", "null"]
        created_at:
          type: string
    ResellerCreditSaleUpdate:
      type: object
      required: [is_paid]
      properties:
        is_paid:
          type: boolean
    ResellerSalesSummary:
      type: object
      required: [reseller_tg_id, reseller_name, sale_count, sold_gb, customer_revenue, amount_to_admin, master_profit, paid_customer_revenue, remaining_customer_revenue]
      properties:
        reseller_tg_id:
          type: number
          format: int64
        reseller_name:
          type: string
        sale_count:
          type: number
        sold_gb:
          type: number
        customer_revenue:
          type: number
        amount_to_admin:
          type: number
        master_profit:
          type: number
        paid_customer_revenue:
          type: number
        remaining_customer_revenue:
          type: number
    ResellerSettlementBalance:
      type: object
      required: [reseller_tg_id, reseller_name, current_sold_gb, current_due, current_profit, previous_balance, period_paid, remaining_amount, payment_status, overdue]
      properties:
        reseller_tg_id:
          type: number
          format: int64
        reseller_name:
          type: string
        current_sold_gb:
          type: number
        current_due:
          type: number
        current_profit:
          type: number
        previous_balance:
          type: number
        period_paid:
          type: number
        remaining_amount:
          type: number
        payment_status:
          type: string
        overdue:
          type: boolean
    ResellerSettlementPaymentCreate:
      type: object
      required: [reseller_tg_id, amount]
      properties:
        reseller_tg_id:
          type: number
          format: int64
        amount:
          type: number
        payment_date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        note:
          type: ["string", "null"]
    ResellerSettlementPayment:
      type: object
      required: [id, reseller_tg_id, reseller_name, amount, payment_date, note, recorded_by_tg_id, created_at]
      properties:
        id:
          type: number
        reseller_tg_id:
          type: number
          format: int64
        reseller_name:
          type: string
        amount:
          type: number
        payment_date:
          type: string
        note:
          type: ["string", "null"]
        recorded_by_tg_id:
          type: number
          format: int64
        created_at:
          type: string
    Activity:
      type: object
      required: [id, type, title, detail, created_at]
      properties:
        id:
          type: string
        type:
          type: string
        title:
          type: string
        detail:
          type: string
        created_at:
          type: string
    Sale:
      type: object
      required: [id, customer_id, customer_name, reseller_name, service_id, service_name, panel, amount, date, paid, status]
      properties:
