openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Telegram authentication and sessions
  - name: dashboard
    description: Workspace summaries
  - name: sales
    description: Sales ledger operations
  - name: services
    description: Subscription service operations
  - name: customers
    description: Customer operations
  - name: search
    description: Cross-workspace search
  - name: resellers
    description: Master-admin reseller operations
  - name: storefront
    description: Public reseller storefronts and attributed inquiries
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /public/storefronts/{slug}:
    get:
      operationId: getPublicStorefront
      tags: [storefront]
      summary: Get a reseller's public storefront and active offers
      parameters:
        - $ref: "#/components/parameters/StorefrontSlug"
      responses:
        "200":
          description: Public store and visible offers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicStorefront"
        "404":
          description: Storefront is unavailable
  /public/storefronts/{slug}/views:
    post:
      operationId: recordPublicStorefrontView
      tags: [storefront]
      summary: Record an anonymous storefront view by source
      parameters:
        - $ref: "#/components/parameters/StorefrontSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicStorefrontViewInput"
      responses:
        "200":
          description: View recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicStorefrontViewResult"
        "404":
          description: Storefront is unavailable
  /public/storefronts/{slug}/leads:
    post:
      operationId: createPublicStorefrontLead
      tags: [storefront]
      summary: Submit an inquiry for one active storefront offer
      parameters:
        - $ref: "#/components/parameters/StorefrontSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicStorefrontInquiryInput"
      responses:
        "201":
          description: Inquiry saved for the storefront owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicStorefrontInquiryResult"
        "400":
          description: Invalid inquiry
        "404":
          description: Storefront or offer is unavailable
        "429":
          description: A recent inquiry for this phone already exists
  /storefront:
    get:
      operationId: getResellerStorefront
      tags: [storefront]
      summary: Get the current seller's storefront, offers, and performance
      responses:
        "200":
          description: Seller-owned storefront configuration and metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResellerStorefront"
        "401":
          description: Sign in required
    put:
      operationId: updateResellerStorefront
      tags: [storefront]
      summary: Save the current seller's storefront and offer catalog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResellerStorefrontInput"
      responses:
        "200":
          description: Saved storefront configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResellerStorefront"
        "400":
          description: Invalid store configuration
        "409":
          description: Store slug is already in use
  /storefront/leads:
    get:
      operationId: listResellerStorefrontLeads
      tags: [storefront]
      summary: List inquiries owned by the current seller
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Seller-owned storefront inquiries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StorefrontLead"
        "401":
          description: Sign in required
  /storefront/leads/{id}:
    get:
      operationId: getResellerStorefrontLead
      tags: [storefront]
      summary: Get one storefront inquiry owned by the current seller
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Seller-owned storefront inquiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorefrontLead"
        "404":
          description: Inquiry not found
    patch:
      operationId: updateResellerStorefrontLead
      tags: [storefront]
      summary: Update inquiry follow-up status and note
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorefrontLeadUpdateInput"
      responses:
        "200":
          description: Updated seller-owned inquiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorefrontLead"
        "400":
          description: Invalid inquiry update
        "404":
          description: Inquiry not found
  /auth/session:
    get:
      operationId: getAuthSession
      tags: [auth]
      summary: Get the current authenticated session
      responses:
        "200":
          description: Current session or signed-out state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /auth/telegram:
    post:
      operationId: loginWithTelegram
      tags: [auth]
      summary: Sign in with a Telegram Login Widget payload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramLoginInput"
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Invalid Telegram login
        "503":
          description: Telegram authentication is not configured
  /auth/telegram-id:
    post:
      operationId: loginWithTelegramId
      tags: [auth]
      summary: Temporary sign in with an allowlisted Telegram numeric ID
      description: Transitional login for internal use before the Telegram widget is enabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramIdLoginInput"
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "403":
          description: Telegram ID is not allowlisted
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      responses:
        "204":
          description: Session ended
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get role-aware dashboard data
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /sales:
    get:
      operationId: listSales
      tags: [sales]
      summary: List sales visible to the current user
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/FromDate"
        - $ref: "#/components/parameters/ToDate"
      responses:
        "200":
          description: Visible sales
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sale"
  /admin/sales:
    get:
      operationId: listAdminSales
      tags: [sales]
      summary: List all customer sales for the master admin
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/FromDate"
        - $ref: "#/components/parameters/ToDate"
        - $ref: "#/components/parameters/ResellerId"
      responses:
        "200":
          description: Customer sales grouped by reseller context
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminSale"
        "403":
          description: Master admin access required
  /admin/sales/{id}:
    delete:
      operationId: deleteAdminSale
      tags: [sales]
      summary: Delete one customer sales-log row
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Sales-log row deleted
        "403":
          description: Master admin access required
        "404":
          description: Sales-log row not found
  /search:
    get:
      operationId: searchWorkspace
      tags: [search]
      summary: Search visible customers, services, sales, and subscription links
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Matching records visible to the current user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceSearchResult"
  /sales-summary:
    get:
      operationId: getSalesSummary
      tags: [sales]
      summary: Get date-filtered sales and reseller financial summary
      parameters:
        - $ref: "#/components/parameters/FromDate"
        - $ref: "#/components/parameters/ToDate"
      responses:
        "200":
          description: Sales summary for the requested date range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesSummary"
  /reseller-credit-sales/{id}:
    patch:
      operationId: updateResellerCreditSale
      tags: [sales]
      summary: Update a reseller credit payment
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResellerCreditSaleUpdate"
      responses:
        "200":
          description: Updated reseller credit sale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResellerCreditSale"
  /reseller-settlement-payments:
    post:
      operationId: createResellerSettlementPayment
      tags: [sales]
      summary: Record a reseller settlement payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResellerSettlementPaymentCreate"
      responses:
        "201":
          description: Recorded reseller settlement payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResellerSettlementPayment"
  /sales/{id}:
    patch:
      operationId: updateSale
      tags: [sales]
      summary: Update payment and price fields on a sale
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleUpdate"
      responses:
        "200":
          description: Updated sale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"
  /awg-usage:
    get:
      operationId: listAwgUsage
      tags: [services]
      summary: Search current AmneziaWG usage for the user's active services
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/AwgUsageLimit"
        - $ref: "#/components/parameters/AwgUsageOffset"
      responses:
        "200":
          description: Active AWG services matching the search
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AwgUsagePage"
  /awg-usage/{id}/refresh:
    post:
      operationId: refreshAwgUsage
      tags: [services]
      summary: Read live usage from AmneziaWG for one active service
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Fresh AWG usage saved for the service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AwgUsageRefreshResult"
        "404":
          description: Service is not visible to the current user
        "409":
          description: Service is not active, has no AWG client, or is busy
        "429":
          description: This service was checked too recently
        "502":
          description: AmneziaWG usage could not be read
  /admin/awg-usage/worker-log:
    get:
      operationId: getAwgUsageWorkerLog
      tags: [admin]
      summary: Read the current AWG worker status and its latest 100 service results
      responses:
        "200":
          description: In-memory AWG worker status and recent poll events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AwgUsageWorkerLog"
        "403":
          description: Master admin access required
  /services:
    get:
      operationId: listServices
      tags: [services]
      summary: List services visible to the current user
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/ServicesLimit"
      responses:
        "200":
          description: Visible services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
    post:
      operationId: createService
      tags: [services]
      summary: Provision a service on Rain and save it to PostgreSQL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceInput"
      responses:
        "201":
          description: Provisioned service and sale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateServiceResult"
        "400":
          description: Invalid service input
        "502":
          description: Rain panel rejected the service
  /services/{id}:
    patch:
      operationId: updateService
      tags: [services]
      summary: Update service state and note
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceUpdate"
      responses:
        "200":
          description: Updated service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
  /services/{id}/renew:
    post:
      operationId: renewService
      tags: [services]
      summary: Renew a visible service
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenewServiceInput"
      responses:
        "200":
          description: Renewed service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
  /services/{id}/reset-token:
    post:
      operationId: resetServiceToken
      tags: [services]
      summary: Revoke and replace a subscription token
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: New subscription link
          content:
            application/json:
              schema:
                type: object
                required: [subscription_url]
                properties:
                  subscription_url:
                    type: string
  /services/{id}/awg:
    post:
      operationId: createServiceAwg
      tags: [services]
      summary: Create an AmneziaWG client for a visible service
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "201":
          description: AmneziaWG client created
  /services/{id}/repair-provider:
    post:
      operationId: repairServiceProvider
      tags: [services]
      summary: Reactivate one Xray provider user without resetting usage
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceProviderRepairInput"
      responses:
        "200":
          description: One provider user was repaired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceProviderRepairResult"
        "400":
          description: Invalid repair request
        "404":
          description: Service or provider user not found
        "409":
          description: Service is expired, disabled, out of quota, or busy
        "502":
          description: Provider rejected the repair
  /admin/provider-account-audit/scan:
    post:
      operationId: scanProviderAccountAudit
      tags: [admin]
      summary: Scan the next eligible service across enabled provider panels
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderAccountAuditScanInput"
      responses:
        "200":
          description: Read-only provider status scan results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderAccountAuditScanResult"
        "400":
          description: Invalid scan cursor
        "403":
          description: Master admin access required
  /admin/provider-account-audit/repair:
    post:
      operationId: repairProviderAccountAudit
      tags: [admin]
      summary: Reactivate one reviewed provider account without changing quota or usage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderAccountAuditRepairInput"
      responses:
        "200":
          description: Account repaired or safely skipped after revalidation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderAccountAuditRepairResult"
        "400":
          description: Invalid repair request
        "403":
          description: Master admin access required
        "404":
          description: Service or provider account no longer exists
        "409":
          description: Service is no longer eligible or is busy
        "502":
          description: Provider rejected the status update
  /admin/telegram/control-center:
    get:
      operationId: getTelegramControlCenter
      tags: [admin]
      summary: Read Telegram bot health, recent activity, recipients, and delivery metrics
      responses:
        "200":
          description: Telegram Control Center snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramControlCenter"
        "403":
          description: Master admin access required
  /admin/telegram/settings:
    patch:
      operationId: updateTelegramSettings
      tags: [admin]
      summary: Securely save or update the Telegram bot settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramSettingsInput"
      responses:
        "200":
          description: Saved Telegram settings without returning the token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramControlCenter"
        "400":
          description: Invalid settings or bot token
        "403":
          description: Master admin access required
  /admin/telegram/test:
    post:
      operationId: testTelegramBot
      tags: [admin]
      summary: Verify the configured Telegram bot and send an optional test message
      responses:
        "200":
          description: Bot test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramBotTestResult"
        "403":
          description: Master admin access required
        "409":
          description: Link the admin account to the bot before sending a test message
  /admin/telegram/recipients:
    get:
      operationId: listTelegramRecipients
      tags: [admin]
      summary: List linked Telegram recipients
      responses:
        "200":
          description: Linked admin and reseller recipients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TelegramRecipient"
        "403":
          description: Master admin access required
  /admin/telegram/recipients/{telegram_id}:
    delete:
      operationId: revokeTelegramRecipient
      tags: [admin]
      summary: Revoke a linked Telegram recipient
      parameters:
        - name: telegram_id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      responses:
        "200":
          description: Recipient link revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramRecipientRevocation"
        "403":
          description: Master admin access required
  /admin/telegram/deliveries:
    get:
      operationId: listTelegramDeliveries
      tags: [admin]
      summary: List Telegram message delivery attempts
      parameters:
        - $ref: "#/components/parameters/TelegramLimit"
      responses:
        "200":
          description: Recent delivery records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TelegramDelivery"
        "403":
          description: Master admin access required
  /admin/telegram/events:
    get:
      operationId: listTelegramEvents
      tags: [admin]
      summary: List recent business events sent to Telegram
      parameters:
        - $ref: "#/components/parameters/TelegramLimit"
      responses:
        "200":
          description: Recent event records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TelegramEvent"
        "403":
          description: Master admin access required
  /admin/telegram/recipients/{telegram_id}/preferences:
    patch:
      operationId: updateTelegramRecipientPreferences
      tags: [admin]
      summary: Update one recipient's permitted Telegram alert categories
      parameters:
        - name: telegram_id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramPreferencesInput"
      responses:
        "200":
          description: Recipient preferences updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramRecipient"
        "403":
          description: Master admin access required
        "404":
          description: Linked recipient not found
  /services/{id}/awg/config:
    get:
      operationId: downloadServiceAwg
      tags: [services]
      summary: Download an AmneziaWG configuration
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: WireGuard configuration file
          content:
            text/plain:
              schema:
                type: string
  /customers:
    get:
      operationId: listCustomers
      tags: [customers]
      summary: List customers visible to the current user
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Visible customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Customer"
  /customers/{id}:
    get:
      operationId: getCustomer
      tags: [customers]
      summary: Get a customer and their visible history
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Customer details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerDetail"
  /resellers:
    get:
      operationId: listResellers
      tags: [resellers]
      summary: List resellers for the master admin
      responses:
        "200":
          description: Resellers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reseller"
  /resellers/{id}:
    patch:
      operationId: updateReseller
      tags: [resellers]
      summary: Enable or disable a reseller
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResellerUpdate"
      responses:
        "200":
          description: Updated reseller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reseller"
  /public/subscription/{token}/openvpn:
    get:
      operationId: getOpenVpnAccount
      tags: [services]
      summary: Read previously saved OpenVPN access without contacting the provider
      parameters:
        - $ref: "#/components/parameters/SubscriptionToken"
      responses:
        "200":
          description: Persisted OpenVPN account details and import locations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenVpnDelivery"
        "404":
          description: Subscription not found or no OpenVPN account has been saved
        "410":
          description: Subscription is no longer active
    post:
      operationId: createOpenVpnAccount
      tags: [services]
      summary: Create or retrieve and persist OpenVPN access after an explicit user action
      parameters:
        - $ref: "#/components/parameters/SubscriptionToken"
      responses:
        "200":
          description: OpenVPN account details and import locations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenVpnDelivery"
        "404":
          description: Subscription not found
        "410":
          description: Subscription is no longer active
        "503":
          description: No OpenVPN provider is configured
  /public/subscription/{token}/openvpn/config/{provider}/{host}:
    get:
      operationId: downloadOpenVpnProfile
      tags: [services]
      summary: Download a private OpenVPN profile for a subscription
      parameters:
        - $ref: "#/components/parameters/SubscriptionToken"
        - $ref: "#/components/parameters/OpenVpnProviderPath"
        - $ref: "#/components/parameters/OpenVpnHostPath"
      responses:
        "200":
          description: OpenVPN profile file
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Subscription or provider not found
        "410":
          description: Subscription is no longer active
  /public/subscription/{token}/openvpn/bundle/{provider}:
    get:
      operationId: downloadOpenVpnBundle
      tags: [services]
      summary: Download the OpenVPN profiles bundle for a subscription
      parameters:
        - $ref: "#/components/parameters/SubscriptionToken"
        - $ref: "#/components/parameters/OpenVpnProviderPath"
      responses:
        "200":
          description: OpenVPN profile bundle
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Subscription or provider not found
        "410":
          description: Subscription is no longer active
  /public/subscription/{token}/wireguard:
    get:
      operationId: getWireGuardAccount
      tags: [services]
      summary: Read previously saved WireGuard access without contacting the provider
      parameters:
        - $ref: "#/components/parameters/SubscriptionToken"
      responses:
        "200":
          description: Persisted WireGuard account and locations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WireGuardDelivery"
        "404":
          description: Subscription, enabled reseller feature, or saved account not found
        "410":
          description: Subscription is no longer active
    post:
      operationId: createWireGuardAccount
      tags: [services]
      summary: Create or retrieve WireGuard access after an explicit user action
      parameters:
        - $ref: "#/components/parameters/SubscriptionToken"
      responses:
        "200":
          description: WireGuard account and locations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WireGuardDelivery"
        "404":
          description: Subscription or enabled reseller feature not found
        "409":
          description: Account preparation is already in progress
        "410":
          description: Subscription is no longer active
        "503":
          description: No enabled WireGuard AzadPanel provider is configured
  /public/subscription/{token}/ipsec:
    get:
      operationId: getIpsecAccount
      tags: [services]
      summary: Read previously saved IPsec account information
      parameters:
        - $ref: "#/components/parameters/SubscriptionToken"
      responses:
        "200":
          description: Saved IPsec/IKEv2 credentials and locations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IpsecDelivery"
        "404":
          description: Subscription, reseller permission, or saved account not found
        "410":
          description: Subscription is no longer active
    post:
      operationId: createIpsecAccount
      tags: [services]
      summary: Create or retrieve IPsec access after an explicit customer action
      parameters:
        - $ref: "#/components/parameters/SubscriptionToken"
      responses:
        "200":
          description: IPsec credentials and locations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IpsecDelivery"
        "404":
          description: Subscription or reseller IPsec permission not found
        "409":
          description: Account preparation is already in progress
        "410":
          description: Subscription is no longer active
        "503":
          description: No enabled IPsec AzadPanel provider is configured
  /public/subscription/{token}/ipsec/mobileconfig:
    get:
      operationId: downloadIpsecMobileConfig
      tags: [services]
      summary: Download the Apple IKEv2 profile for a saved IPsec account
      parameters:
        - $ref: "#/components/parameters/SubscriptionToken"
      responses:
        "200":
          description: Apple configuration profile
          content:
            application/x-apple-aspen-config:
              schema:
                type: string
        "404":
          description: Subscription, permission, or saved account not found
        "410":
          description: Subscription is no longer active
  /public/subscription/{token}/wireguard/config/{provider}/{host}:
    get:
      operationId: downloadWireGuardConfig
      tags: [services]
      summary: Download a private WireGuard configuration for a subscription
      parameters:
        - $ref: "#/components/parameters/SubscriptionToken"
        - $ref: "#/components/parameters/WireGuardProviderPath"
        - $ref: "#/components/parameters/WireGuardHostPath"
      responses:
        "200":
          description: WireGuard .conf profile
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Subscription, provider, or location not found
        "410":
          description: Subscription is no longer active
  /public/subscription/{token}/wireguard/mobileconfig/{provider}/{host}:
    get:
      operationId: downloadWireGuardIOSMobileConfig
      tags: [services]
      summary: Download an official iOS configuration profile for a WireGuard location
      parameters:
        - $ref: "#/components/parameters/SubscriptionToken"
        - $ref: "#/components/parameters/WireGuardProviderPath"
        - $ref: "#/components/parameters/WireGuardHostPath"
      responses:
        "200":
          description: iOS WireGuard configuration profile; iOS requires the customer to confirm installation in Settings
          content:
            application/x-apple-aspen-config:
              schema:
                type: string
                format: binary
        "404":
          description: Subscription, provider, or location not found
        "410":
          description: Subscription is no longer active
  /public/subscription/{token}/wireguard/bundle/{provider}:
    get:
      operationId: downloadWireGuardBundle
      tags: [services]
      summary: Download all WireGuard locations as a text bundle
      parameters:
        - $ref: "#/components/parameters/SubscriptionToken"
        - $ref: "#/components/parameters/WireGuardProviderPath"
      responses:
        "200":
          description: WireGuard configuration bundle
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Subscription or provider not found
        "410":
          description: Subscription is no longer active
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: number
        minimum: 1
    SubscriptionToken:
      name: token
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{12,256}$"
    StorefrontSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        minLength: 3
        maxLength: 48
        pattern: "^[a-z0-9][a-z0-9-]{1,46}[a-z0-9]$"
    OpenVpnProviderPath:
      name: provider
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9_-]{2,64}$"
    OpenVpnHostPath:
      name: host
      in: path
      required: true
      schema:
        type: string
        maxLength: 80
        pattern: "^[A-Za-z0-9._-]{1,80}$"
    WireGuardProviderPath:
      name: provider
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9_-]{2,64}$"
    WireGuardHostPath:
      name: host
      in: path
      required: true
      schema:
        type: string
        maxLength: 80
        pattern: "^[A-Za-z0-9._-]{1,80}$"
    Search:
      name: search
      in: query
      required: false
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: number
        minimum: 1
        maximum: 200
        default: 100
    ServicesLimit:
      name: limit
      in: query
      required: false
      description: Maximum visible services returned for management filtering
      schema:
        type: number
        minimum: 1
        maximum: 5000
        default: 1000
    AwgUsageLimit:
      name: limit
      in: query
      required: false
      description: Maximum active AWG users returned per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    AwgUsageOffset:
      name: offset
      in: query
      required: false
      description: Number of matching active AWG users to skip
      schema:
        type: integer
        minimum: 0
        maximum: 100000
        default: 0
    FromDate:
      name: from
      in: query
      required: false
      description: Start date in ISO Gregorian format; the UI displays this as a Persian date.
      schema:
        type: string
        pattern: '^\d{4}-\d{2}-\d{2}$'
    ToDate:
      name: to
      in: query
      required: false
      description: End date in ISO Gregorian format; the UI displays this as a Persian date.
      schema:
        type: string
        pattern: '^\d{4}-\d{2}-\d{2}$'
    ResellerId:
      name: reseller_id
      in: query
      required: false
      schema:
        type: number
        minimum: 1
    TelegramLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    TelegramRecipient:
      type: object
      required: [telegram_id, role, display_name, linked_at, active, categories, last_seen_at, last_delivery_at]
      properties:
        telegram_id: { type: number, minimum: 1 }
        role: { type: string, enum: [master_admin, reseller] }
        display_name: { type: ["string", "null"] }
        linked_at: { type: string }
        active: { type: boolean }
        categories:
          type: array
          items: { type: string }
        last_seen_at: { type: ["string", "null"] }
        last_delivery_at: { type: ["string", "null"] }
    TelegramDelivery:
      type: object
      required: [id, event_key, category, title, body, recipient_telegram_id, recipient_name, status, attempts, last_error, created_at, sent_at]
      properties:
        id: { type: number, minimum: 1 }
        event_key: { type: string }
        category: { type: string }
        title: { type: string }
        body: { type: string }
        recipient_telegram_id: { type: number, minimum: 1 }
        recipient_name: { type: string }
        status: { type: string, enum: [queued, sent, retrying, failed, skipped] }
        attempts: { type: number, minimum: 0 }
        last_error: { type: ["string", "null"] }
        created_at: { type: string }
        sent_at: { type: ["string", "null"] }
    TelegramEvent:
      type: object
      required: [id, event_key, category, action, entity_type, entity_id, actor_name, actor_role, owner_name, title, body, href, created_at]
      properties:
        id: { type: number, minimum: 1 }
        event_key: { type: string }
        category: { type: string }
        action: { type: string }
        entity_type: { type: string }
        entity_id: { type: string }
        actor_name: { type: string }
        actor_role: { type: string }
        owner_name: { type: ["string", "null"] }
        title: { type: string }
        body: { type: string }
        href: { type: ["string", "null"] }
        created_at: { type: string }
    TelegramControlCenter:
      type: object
      required: [configured, enabled, bot_username, panel_url, worker_status, worker_error, last_polled_at, linked_recipients, sent_today, success_rate, pending_count, failed_count, latest_sent_at, recipients, deliveries, events]
      properties:
        configured: { type: boolean }
        enabled: { type: boolean }
        bot_username: { type: ["string", "null"] }
        panel_url: { type: ["string", "null"] }
        worker_status: { type: string, enum: [unconfigured, paused, running, stale, error] }
        worker_error: { type: ["string", "null"] }
        last_polled_at: { type: ["string", "null"] }
        linked_recipients: { type: number, minimum: 0 }
        sent_today: { type: number, minimum: 0 }
        success_rate: { type: number, minimum: 0, maximum: 100 }
        pending_count: { type: number, minimum: 0 }
        failed_count: { type: number, minimum: 0 }
        latest_sent_at: { type: ["string", "null"] }
        recipients:
          type: array
          items: { $ref: "#/components/schemas/TelegramRecipient" }
        deliveries:
          type: array
          items: { $ref: "#/components/schemas/TelegramDelivery" }
        events:
          type: array
          items: { $ref: "#/components/schemas/TelegramEvent" }
    TelegramSettingsInput:
      type: object
      properties:
        token: { type: string, minLength: 30, maxLength: 256 }
        enabled: { type: boolean }
        panel_url: { type: ["string", "null"], maxLength: 300 }
        timezone: { type: string, minLength: 1, maxLength: 64 }
    TelegramBotTestResult:
      type: object
      required: [ok, bot_username, sent, message]
      properties:
        ok: { type: boolean }
        bot_username: { type: ["string", "null"] }
        sent: { type: boolean }
        message: { type: string }
    TelegramPreferencesInput:
      type: object
      required: [categories]
      properties:
        categories:
          type: array
          maxItems: 12
          items:
            type: string
            enum: [users, sales, services, requests, providers, usage, accounting, system]
    TelegramRecipientRevocation:
      type: object
      required: [revoked, telegram_id]
      properties:
        revoked: { type: boolean }
        telegram_id: { type: number, minimum: 1 }
    TelegramLoginInput:
      type: object
      required: [id, auth_date, hash]
      properties:
        id:
          type: number
          format: int64
        first_name:
          type: string
        last_name:
          type: ["string", "null"]
        username:
          type: ["string", "null"]
        photo_url:
          type: ["string", "null"]
        auth_date:
          type: number
        hash:
          type: string
    TelegramIdLoginInput:
      type: object
      required: [telegram_id]
      properties:
        telegram_id:
          type: number
          format: int64
          minimum: 1
    StorefrontOffer:
      type: object
      required: [id, title, description, gb, days, price, enabled, sort_order]
      properties:
        id:
          type: number
          multipleOf: 1
          minimum: 1
        title:
          type: string
        description:
          type: string
        gb:
          type: number
          exclusiveMinimum: 0
        days:
          type: number
          multipleOf: 1
          minimum: 1
        price:
          type: number
          minimum: 0
        enabled:
          type: boolean
        sort_order:
          type: number
          multipleOf: 1
    StorefrontOfferInput:
      type: object
      required: [id, title, description, gb, days, price, enabled, sort_order]
      properties:
        id:
          type: ["number", "null"]
          multipleOf: 1
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 280
        gb:
          type: number
          exclusiveMinimum: 0
          maximum: 5000
        days:
          type: number
          multipleOf: 1
          minimum: 1
          maximum: 3650
        price:
          type: number
          minimum: 0
          maximum: 1000000000000
        enabled:
          type: boolean
        sort_order:
          type: number
          multipleOf: 1
          minimum: 0
          maximum: 100
    StorefrontStats:
      type: object
      required: [views, inquiries, conversions, attributed_revenue]
      properties:
        views:
          type: number
          multipleOf: 1
          minimum: 0
        inquiries:
          type: number
          multipleOf: 1
          minimum: 0
        conversions:
          type: number
          multipleOf: 1
          minimum: 0
        attributed_revenue:
          type: number
          minimum: 0
    StorefrontLead:
      type: object
      required: [id, customer_name, phone, offer_id, offer_name, gb, days, offer_price, message, source, status, seller_note, created_at, converted_sale_id]
      properties:
        id:
          type: number
          multipleOf: 1
        customer_name:
          type: string
        phone:
          type: string
        offer_id:
          type: ["number", "null"]
          multipleOf: 1
        offer_name:
          type: string
        gb:
          type: number
        days:
          type: number
          multipleOf: 1
        offer_price:
          type: number
        message:
          type: ["string", "null"]
        source:
          type: ["string", "null"]
        status:
          type: string
          enum: [new, contacted, converted, closed]
        seller_note:
          type: ["string", "null"]
        created_at:
          type: string
        converted_sale_id:
          type: ["number", "null"]
          multipleOf: 1
    ResellerStorefront:
      type: object
      required: [slug, store_name, description, whatsapp_phone, enabled, offers, stats]
      properties:
        slug:
          type: string
        store_name:
          type: string
        description:
          type: string
        whatsapp_phone:
          type: ["string", "null"]
        enabled:
          type: boolean
        offers:
          type: array
          items:
            $ref: "#/components/schemas/StorefrontOffer"
        stats:
          $ref: "#/components/schemas/StorefrontStats"
    ResellerStorefrontInput:
      type: object
      required: [slug, store_name, description, whatsapp_phone, enabled, offers]
      properties:
        slug:
          type: string
          minLength: 3
          maxLength: 48
          pattern: "^[a-z0-9][a-z0-9-]{1,46}[a-z0-9]$"
        store_name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
        whatsapp_phone:
          type: ["string", "null"]
          maxLength: 30
        enabled:
          type: boolean
        offers:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/StorefrontOfferInput"
    PublicStorefront:
      type: object
      required: [slug, store_name, description, whatsapp_phone, offers]
      properties:
        slug:
          type: string
        store_name:
          type: string
        description:
          type: string
        whatsapp_phone:
          type: ["string", "null"]
        offers:
          type: array
          items:
            $ref: "#/components/schemas/StorefrontOffer"
    PublicStorefrontViewInput:
      type: object
      required: [source]
      properties:
        source:
          type: string
          maxLength: 80
    PublicStorefrontViewResult:
      type: object
      required: [recorded]
      properties:
        recorded:
          type: boolean
    PublicStorefrontInquiryInput:
      type: object
      required: [customer_name, phone, offer_id, message, source, website]
      properties:
        customer_name:
          type: string
          minLength: 2
          maxLength: 120
        phone:
          type: string
          minLength: 7
          maxLength: 30
        offer_id:
          type: number
          multipleOf: 1
          minimum: 1
        message:
          type: string
          maxLength: 500
        source:
          type: string
          maxLength: 80
        website:
          type: string
          maxLength: 200
    PublicStorefrontInquiryResult:
      type: object
      required: [lead_id, whatsapp_url]
      properties:
        lead_id:
          type: number
          multipleOf: 1
        whatsapp_url:
          type: ["string", "null"]
    StorefrontLeadUpdateInput:
      type: object
      required: [status, seller_note]
      properties:
        status:
          type: string
          enum: [new, contacted, closed]
        seller_note:
          type: ["string", "null"]
          maxLength: 500
    CreateServiceInput:
      type: object
      required: [customer_name, phone, label, gb, days]
      properties:
        customer_name:
          type: string
          minLength: 1
        phone:
          type: string
          minLength: 3
        label:
          type: string
          minLength: 1
          maxLength: 64
        gb:
          type: number
          exclusiveMinimum: 0
        days:
          type: number
          minimum: 1
        sell_price:
          type: ["number", "null"]
          minimum: 0
        is_paid:
          type: boolean
          default: true
        storefront_lead_id:
          type: ["number", "null"]
          multipleOf: 1
          minimum: 1
    AuthSession:
      type: object
      required: [authenticated, role]
      properties:
        authenticated:
          type: boolean
        role:
          type: string
          enum: [signed_out, master_admin, reseller]
        telegram_id:
          type: ["number", "null"]
          format: int64
        display_name:
          type: ["string", "null"]
        reseller_id:
          type: ["number", "null"]
          format: int32
        title:
          type: ["string", "null"]
        customer_price_per_gb:
          type: ["number", "null"]
    DashboardDay:
      type: object
      required: [day, sales_count, sold_gb, income, paid_income, unpaid_income, profit, paid_profit, unpaid_profit]
      properties:
        day:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        sales_count:
          type: number
        sold_gb:
          type: number
        income:
          type: number
        paid_income:
          type: number
        unpaid_income:
          type: number
        profit:
          type: number
        paid_profit:
          type: number
        unpaid_profit:
          type: number
    DashboardSummary:
      type: object
      required: [revenue, active_services, renewals_due, service_health, visible_customers, visible_resellers, month_sales_count, month_sold_gb, month_income, month_paid_income, month_unpaid_income, month_profit, month_daily, disabled_today, generated_at, recent_activity]
      properties:
        revenue:
          type: number
        active_services:
          type: number
        renewals_due:
          type: number
        service_health:
          type: number
        visible_customers:
          type: number
        visible_resellers:
          type: number
        month_sales_count:
          type: number
        month_sold_gb:
          type: number
        month_income:
          type: number
        month_paid_income:
          type: number
        month_unpaid_income:
          type: number
        month_profit:
          type: number
        month_daily:
          type: array
          items:
            $ref: "#/components/schemas/DashboardDay"
        disabled_today:
          type: number
        generated_at:
          type: string
        recent_activity:
          type: array
          items:
            $ref: "#/components/schemas/Activity"
    SalesSummary:
      type: object
      required: [from, to, sold_gb, income, paid_income, unpaid_income, admin_cost, admin_due, admin_due_gb, outstanding_admin_due, outstanding_admin_due_gb, remaining_profit, paid_profit, unpaid_profit, remaining_to_collect, cash_after_admin, reseller_due, reseller_paid, reseller_remaining, reseller_due_gb, reseller_profit, reseller_balances, reseller_credit_sales, reseller_sales, reseller_settlements, reseller_payment_history]
      properties:
        from:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        to:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        sold_gb:
          type: number
        income:
          type: number
        paid_income:
          type: number
        unpaid_income:
          type: number
        admin_cost:
          type: number
        admin_due:
          type: number
        admin_due_gb:
          type: number
        outstanding_admin_due:
          type: number
        outstanding_admin_due_gb:
          type: number
        remaining_profit:
          type: number
        paid_profit:
          type: number
        unpaid_profit:
          type: number
        remaining_to_collect:
          type: number
        cash_after_admin:
          type: number
        reseller_due:
          type: number
        reseller_paid:
          type: number
        reseller_remaining:
          type: number
        reseller_due_gb:
          type: number
        reseller_profit:
          type: number
        reseller_balances:
          type: array
          items:
            $ref: "#/components/schemas/ResellerBalance"
        reseller_credit_sales:
          type: array
          items:
            $ref: "#/components/schemas/ResellerCreditSale"
        reseller_sales:
          type: array
          items:
            $ref: "#/components/schemas/ResellerSalesSummary"
        reseller_settlements:
          type: array
          items:
            $ref: "#/components/schemas/ResellerSettlementBalance"
        reseller_payment_history:
          type: array
          items:
            $ref: "#/components/schemas/ResellerSettlementPayment"
    ResellerBalance:
      type: object
      required: [reseller_tg_id, reseller_name, due_gb, due_amount, paid_amount, remaining_amount, profit_amount]
      properties:
        reseller_tg_id:
          type: number
          format: int64
        reseller_name:
          type: string
        due_gb:
          type: number
        due_amount:
          type: number
        paid_amount:
          type: number
        remaining_amount:
          type: number
        profit_amount:
          type: number
    ResellerCreditSale:
      type: object
      required: [id, reseller_tg_id, reseller_name, gb_amount, unit_price, total_amount, profit_amount, paid, note, created_at]
      properties:
        id:
          type: number
        reseller_tg_id:
          type: number
          format: int64
        reseller_name:
          type: string
        gb_amount:
          type: number
        unit_price:
          type: number
        total_amount:
          type: number
        profit_amount:
          type: number
        paid:
          type: boolean
        note:
          type: ["string", "null"]
        created_at:
          type: string
    ResellerCreditSaleUpdate:
      type: object
      required: [is_paid]
      properties:
        is_paid:
          type: boolean
    ResellerSalesSummary:
      type: object
      required: [reseller_tg_id, reseller_name, sale_count, sold_gb, customer_revenue, amount_to_admin, master_profit, paid_customer_revenue, remaining_customer_revenue]
      properties:
        reseller_tg_id:
          type: number
          format: int64
        reseller_name:
          type: string
