kind = "web"
previewPath = "/"
title = "Sales Manager"
description = "A responsive sales management web app for tracking subscriptions, customers, services, revenue, and panel operations across desktop and mobile."
version = "1.0.0"
id = "artifacts/sales-manager"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25573

[services.development]
run = "pnpm --filter @workspace/sales-manager run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sales-manager", "run", "build" ]
serve = "static"
publicDir = "artifacts/sales-manager/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25573"
BASE_PATH = "/"
